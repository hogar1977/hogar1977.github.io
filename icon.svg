<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d53"/><stop offset="1" stop-color="#33363b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282c"/><stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#000000" stop-opacity="0.08"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <!-- shadow on the desk -->
  <rect x="30" y="44" width="196" height="200" rx="46" fill="#000000" opacity="0.28" filter="url(#soft)"/>
  <!-- the key's body (its sides), then the top face, slightly smaller -->
  <rect x="20" y="24" width="216" height="212" rx="48" fill="url(#side)"/>
  <rect x="34" y="20" width="188" height="184" rx="38" fill="url(#face)"/>
  <!-- the dished top and a light edge where the face meets the sides -->
  <rect x="34" y="20" width="188" height="184" rx="38" fill="url(#dish)"/>
  <rect x="35" y="21" width="186" height="182" rx="37" fill="none" stroke="#8a8e96" stroke-width="2" opacity="0.55"/>
  <!-- the envelope, drawn as an outline -->
  <g fill="none" stroke="#ececec" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <rect x="66" y="66" width="124" height="88" rx="14"/>
    <path d="M72 76 L128 118 L184 76"/>
  </g>
</svg>
